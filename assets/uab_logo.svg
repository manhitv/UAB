<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="uabBar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
  </defs>

  <!-- transparent background -->

  <!-- mark: adaptive budget bars (taller = harder question gets more samples) -->
  <g transform="translate(48,40)">
    <line x1="-4" y1="120" x2="150" y2="120" stroke="#15803d" stroke-width="3" stroke-linecap="round" opacity="0.40"/>
    <rect x="0"   y="92"  width="20" height="28"  rx="5" fill="url(#uabBar)" opacity="0.55"/>
    <rect x="30"  y="74"  width="20" height="46"  rx="5" fill="url(#uabBar)" opacity="0.70"/>
    <rect x="60"  y="40"  width="20" height="80"  rx="5" fill="url(#uabBar)" opacity="0.85"/>
    <rect x="90"  y="6"   width="20" height="114" rx="5" fill="url(#uabBar)"/>
    <rect x="120" y="58"  width="20" height="62"  rx="5" fill="url(#uabBar)" opacity="0.75"/>
    <!-- difficulty curve over the bars -->
    <path d="M10,96 C40,86 56,40 100,18 C128,6 134,52 130,64"
          fill="none" stroke="#14532d" stroke-width="3.5"
          stroke-linecap="round" stroke-dasharray="2 9" opacity="0.60"/>
    <circle cx="100" cy="18" r="7" fill="#14532d"/>
    <circle cx="100" cy="18" r="2.6" fill="#fde047"/>
  </g>

  <!-- wordmark -->
  <text x="248" y="106" font-size="72" font-weight="800" fill="#14532d" letter-spacing="2">UAB</text>
  <text x="250" y="140" font-size="17" font-weight="600" fill="#15803d" letter-spacing="0.4">Uncertainty-Aware Budget</text>
  <text x="251" y="162" font-size="11" font-weight="600" fill="#3f8f5f" letter-spacing="1.8">ADAPTIVE TEST-TIME ALLOCATION</text>
</svg>
